<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="gallery-header">
        <h1>Responsive Image Gallery</h1>
        <p>Bộ sưu tập ảnh linh hoạt theo kích thước màn hình</p>
    </header>

    <div class="gallery-container">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 1">
            <div class="desc">Thiên nhiên núi non</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 2">
            <div class="desc">Rừng cây xanh mát</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1426604966848-d7adacbd02bff?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 3">
            <div class="desc">Thung lũng thơ mộng</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 4">
            <div class="desc">Hoàng hôn rực rỡ</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 5">
            <div class="desc">Hồ nước tĩnh lặng</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 6">
            <div class="desc">Đường mòn phiêu lưu</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 7">
            <div class="desc">Rừng thông đón nắng</div>
        </div>
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=500&q=80" alt="Cảnh thiên nhiên 8">
            <div class="desc">Dãy núi hùng vĩ</div>
        </div>
    </div>

    <footer class="gallery-footer">
        <p>&copy; 2026 Responsive Gallery Project. Thực hiện bởi Nguyễn Thị Giang.</p>
    </footer>

</body>
</html>
